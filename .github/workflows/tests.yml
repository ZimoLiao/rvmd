name: tests

on:
  push:
  pull_request:

jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends octave
      - name: Run regression suite
        run: octave-cli --no-gui --quiet --eval "addpath('tests'); run_octave_tests;"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends octave
      - name: Install CPU PyTorch and RVMD Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[test]'
      - name: Run Python regression suite
        run: |
          python -m ruff check src tests_python examples_python benchmarks
          python -m ruff format --check src tests_python examples_python benchmarks
          python -m pytest tests_python
