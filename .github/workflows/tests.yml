name: tests

on:
  push:
  pull_request:

jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends octave
      - name: Run regression suite
        run: octave-cli --no-gui --quiet --eval "addpath('tests'); run_octave_tests;"
